name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag sportpredict-api:ci apps/api
      - run: >-
          docker run --rm
          -e JWT_SECRET=ci-only-secret-000000000000000000000000000000000000
          sportpredict-api:ci python -c
          "from app.main import app; from xgboost import build_info; assert not build_info().get('USE_CUDA'); print(app.title)"
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: sportpredict
          POSTGRES_DB: sportpredict
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U sportpredict" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      JWT_SECRET: ci-only-secret-000000000000000000000000000000000000
      DATABASE_URL: postgresql+psycopg://sportpredict:ci-only-password@localhost:5432/sportpredict
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-only-admin-password
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
      - run: python -m app.cli seed-demo --approve-demo
      - run: python -m app.cli pipeline
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
