[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sportpredict-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1", "tenacity>=9,<10", "celery[redis]>=5.4,<6", "python-multipart>=0.0.20,<1",
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2", "xgboost-cpu>=2.1,<4; platform_system == 'Linux'",
  "xgboost>=2.1,<4; platform_system != 'Linux'", "joblib>=1.4,<2",
  "structlog>=25,<27", "sentry-sdk[fastapi]>=2.20,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
tracking = ["mlflow>=2.20,<4"]
sports = ["sports-skills @ https://github.com/machina-sports/sports-skills/archive/bdb972c0625fa337e15f18ca58abd28f57f25e37.zip"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error", "ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning"]
