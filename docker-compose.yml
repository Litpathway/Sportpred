name: sportpredict-ai

x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sportpredict}:${POSTGRES_PASSWORD:?Run scripts/configure.py first}@db:5432/${POSTGRES_DB:-sportpredict}
  REDIS_URL: redis://redis:6379/0
  ARTIFACT_DIR: /app/artifacts

x-api: &api
  build:
    context: ./apps/api
    args:
      INSTALL_SPORTS_SKILLS: ${INSTALL_SPORTS_SKILLS:-false}
  env_file: .env
  environment: *api-environment
  volumes:
    - model-artifacts:/app/artifacts
  restart: unless-stopped
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportpredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
      POSTGRES_DB: ${POSTGRES_DB:-sportpredict}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api
    command: [python, -m, alembic, upgrade, head]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/health", timeout=4)']
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *api
    command: [python, -m, celery, -A, app.workers.celery_app.celery, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *api
    command: [python, -m, celery, -A, app.workers.celery_app.celery, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true

volumes:
  postgres-data:
  redis-data:
  model-artifacts:
